# Render blueprint for the merged Flint frontend (static site).
# Replace YOUR-BACKEND with your backend service name (e.g. flint-backend)
# before deploying — the proxy rules forward API and WebSocket traffic to it.
services:
  - type: web
    name: flint-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # REST API → FastAPI backend
      - type: rewrite
        source: /api/*
        destination: https://YOUR-BACKEND.onrender.com/api/*
      # WebSocket (VCT signaling) → FastAPI backend
      - type: rewrite
        source: /ws/*
        destination: https://YOUR-BACKEND.onrender.com/ws/*
      # SPA fallback — React Router handles /nest, /services, /app, ...
      - type: rewrite
        source: /*
        destination: /index.html
