# Render blueprint for the merged Flint frontend (static site).
# API and WebSocket traffic is proxied to the FastAPI backend service.
services:
  - type: web
    name: flint-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # REST API → FastAPI backend
      - type: rewrite
        source: /api/*
        destination: https://flint-video-conferencing.onrender.com/api/*
      # WebSocket (VCT signaling) → FastAPI backend
      - type: rewrite
        source: /ws/*
        destination: https://flint-video-conferencing.onrender.com/ws/*
      # SPA fallback — React Router handles /nest, /services, /app, ...
      - type: rewrite
        source: /*
        destination: /index.html
